{% extends '_base.html' %}
{% block html_head %}
<style>
  #terminal-wrapper {
    border-radius: 0.25rem;
    overflow: hidden;
    background: #1a1a2e;
  }
  #terminal-frame {
    display: block;
    width: 100%;
    height: calc(100vh - 112px);
    min-height: 300px;
    border: 0;
    background: #1a1a2e;
  }
  @media (min-width: 640px) {
    #terminal-frame { height: calc(100vh - 180px); }
  }
  .terminal-fullscreen {
    position: fixed !important;
    inset: 0 !important;
    z-index: 9999 !important;
    margin: 0 !important;
    padding: 0 !important;
    border: 0 !important;
    border-radius: 0 !important;
    box-shadow: none !important;
  }
  .terminal-fullscreen #terminal-frame {
    height: 100vh !important;
  }
  .term-status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .term-status-dot.connected { background: #22c55e; }
  .term-status-dot.disconnected { background: #ef4444; }
  .term-status-dot.connecting { background: #eab308; }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto w-full pt-10 sm:pt-24 md:pt-28 lg:px-4"
     style="padding-bottom:4px" x-data="terminalPage">
  <div class="flex items-center justify-between px-1" style="padding:4px 4px 3px 4px">
    <h1 class="font-bold uppercase text-gray-600">{{locales.terminal_title}}</h1>
    <div class="flex items-center space-x-1 sm:space-x-3">
      <span class="flex items-center space-x-1 text-sm text-gray-500">
        <span class="term-status-dot" :class="status"></span>
        <span x-text="statusText" class="hidden sm:inline"></span>
      </span>
      <button @click="disconnect()" x-show="status === 'connected'" x-cloak
              class="rounded border border-red-300 px-2 sm:px-3 py-1 text-sm text-red-600 hover:bg-red-50 transition-colors"
              title="{{locales.terminal_disconnect}}">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        <span class="hidden sm:inline ml-1">{{locales.terminal_disconnect}}</span>
      </button>
      <button @click="reconnect()"
              class="rounded border border-gray-300 px-2 sm:px-3 py-1 text-sm text-gray-600 hover:bg-gray-200 transition-colors"
              title="{{locales.terminal_reconnect}}">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span class="hidden sm:inline ml-1">{{locales.terminal_reconnect}}</span>
      </button>
      <button @click="toggleFullscreen()"
              class="rounded border border-gray-300 px-2 py-1 text-sm text-gray-600 hover:bg-gray-200 transition-colors flex items-center"
              :title="isFullscreen ? 'Exit Fullscreen' : 'Fullscreen'">
        <svg x-show="!isFullscreen" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5"/></svg>
        <svg x-show="isFullscreen" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 4H4v5m0-5l5 5m6-5h5v5m0-5l-5 5M9 20H4v-5m0 5l5-5m6 5h5v-5m0 5l-5-5"/></svg>
      </button>
    </div>
  </div>

  <div class="mb-0 px-0">
    <div id="terminal-wrapper" class="rounded border shadow">
      <iframe id="terminal-frame" title="Terminal"
              allow="clipboard-read; clipboard-write"></iframe>
    </div>
  </div>
  <button x-show="isFullscreen" x-cloak @click="toggleFullscreen()"
          style="position:fixed;top:8px;right:8px;z-index:10000;background:rgba(255,255,255,0.85);color:#333;border:1px solid #999;border-radius:4px;padding:4px 12px;font-size:14px;cursor:pointer">
    ✕ Exit
  </button>
</div>
{% endblock %}

{% block bottom %}
<script>
document.addEventListener("alpine:init", () => {
  Alpine.store("app").set_page("terminal");
  Alpine.data("terminalPage", () => ({
    status: "connecting",
    isFullscreen: false,

    get statusText() {
      if (this.status === "connected") return "{{locales.terminal_connected}}";
      if (this.status === "connecting") return "{{locales.terminal_connecting}}";
      return "{{locales.terminal_disconnected}}";
    },

    init() {
      const frame = document.getElementById("terminal-frame");
      frame.addEventListener("load", () => {
        if (frame.src !== "about:blank") this.status = "connected";
      });
      this.reconnect();
    },

    terminalUrl() {
      return window.location.protocol + "//" + window.location.hostname + ":7681/";
    },

    disconnect() {
      document.getElementById("terminal-frame").src = "about:blank";
      this.status = "disconnected";
    },

    reconnect() {
      const frame = document.getElementById("terminal-frame");
      this.status = "connecting";
      frame.src = "about:blank";
      setTimeout(() => { frame.src = this.terminalUrl(); }, 30);
    },

    toggleFullscreen() {
      this.isFullscreen = !this.isFullscreen;
      document.getElementById("terminal-wrapper")
        .classList.toggle("terminal-fullscreen", this.isFullscreen);
    }
  }));
});
</script>
{% endblock %}
