<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ name }}</title>
  <meta name="theme-color" content="#000000">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/vendor-dark.css">
</head>
<body class="pcat-public-share bg-gray-100">
  <div class="mx-auto mt-24 max-w-sm p-4">
    <form method="post" class="rounded-lg bg-white p-6 shadow">
      <h1 class="text-lg font-bold text-gray-700">🔒 {{ name }}</h1>
      <p class="mt-1 text-sm text-gray-500">此链接受密码保护 / This link is password protected.</p>
      {% if error %}<p class="mt-2 text-sm text-red-600">密码错误 / Wrong password.</p>{% endif %}
      <input type="password" name="password" autofocus autocomplete="off"
             class="mt-4 w-full rounded border border-gray-300 px-3 py-2 text-sm">
      <button type="submit" class="mt-3 w-full rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white">打开共享</button>
    </form>
  </div>
</body>
</html>
