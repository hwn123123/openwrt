{% extends '_base.html' %}{% block page_title %}手机推送中心{% endblock %}
{% block html_head %}<link rel="stylesheet" href="/static/vendor-extensions.css?v={{ cache_bust_version }}"><style>
.pc-wrap{width:min(100% - 2rem,92rem);margin:auto;padding:7.2rem 0 5rem}.pc-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:1rem}.pc-back{color:var(--pcat-muted)!important;text-decoration:none}.pc-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(18rem,.75fr);gap:1rem}.pc-card{padding:1.25rem;border:1px solid var(--pcat-border);border-radius:var(--pcat-radius);background:var(--pcat-surface)}.pc-state{display:flex;align-items:center;gap:.6rem}.pc-dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--pcat-faint)}.pc-dot.on{background:var(--pcat-accent);box-shadow:0 0 10px var(--pcat-accent)}.pc-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem;margin-top:1rem}.pc-field{display:flex;flex-direction:column;gap:.35rem}.pc-field label,.pc-muted{color:var(--pcat-muted);font-size:.77rem;line-height:1.6}.pc-field input,.pc-field select{border:1px solid var(--pcat-border);border-radius:.65rem;background:#070b09;color:var(--pcat-text);padding:.65rem}.pc-checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin-top:1rem}.pc-check{display:flex;align-items:center;gap:.5rem}.pc-actions{display:flex;gap:.6rem;margin-top:1rem}.pc-btn{padding:.62rem .9rem;border:1px solid var(--pcat-border);border-radius:.65rem;background:#111715;color:var(--pcat-text);cursor:pointer}.pc-btn.primary{border-color:rgba(38,214,160,.45);background:rgba(38,214,160,.12);color:var(--pcat-accent)}.pc-history{white-space:pre-wrap;word-break:break-all;padding:.8rem;border-radius:.7rem;background:#070b09;color:var(--pcat-muted);font-size:.7rem;line-height:1.7;min-height:6rem}.pc-message{min-height:1.2rem;margin-top:.7rem;color:var(--pcat-accent);font-size:.78rem}@media(max-width:720px){.pc-wrap{width:min(100% - 1rem,92rem);padding:5.4rem 0}.pc-grid,.pc-fields,.pc-checks{grid-template-columns:1fr}.pc-head{align-items:start;flex-direction:column;gap:.6rem}}
</style>{% endblock %}
{% block content %}<main class="pc-wrap" x-data="pushCenter()" x-init="load()"><header class="pc-head"><div><a class="pc-back" href="/apps">‹ 应用中心</a><h1>手机推送中心</h1></div><div class="pc-state"><span class="pc-dot" :class="status.enabled&&status.configured?'on':''"></span><strong x-text="status.enabled?(status.configured?'已启用':'等待配置'):'已停用'"></strong></div></header><div class="pc-grid"><section class="pc-card"><h2>服务与凭据</h2><div class="pc-fields"><div class="pc-field"><label>推送服务</label><select x-model="cfg.provider"><option value="ntfy">ntfy</option><option value="telegram">Telegram Bot</option><option value="webhook">通用 Webhook</option></select></div><div class="pc-field" x-show="cfg.provider==='ntfy'"><label>ntfy 服务器</label><input x-model="cfg.ntfy_server" placeholder="https://ntfy.sh"></div><div class="pc-field" x-show="cfg.provider==='ntfy'"><label>ntfy 主题</label><input x-model="cfg.ntfy_topic" placeholder="使用难猜的长主题"></div><div class="pc-field" x-show="cfg.provider==='ntfy'"><label>ntfy Token（可选）</label><input type="password" x-model="cfg.ntfy_token"></div><div class="pc-field" x-show="cfg.provider==='telegram'"><label>Bot Token</label><input type="password" x-model="cfg.telegram_bot_token"></div><div class="pc-field" x-show="cfg.provider==='telegram'"><label>Chat ID</label><input x-model="cfg.telegram_chat_id"></div><div class="pc-field" x-show="cfg.provider==='webhook'"><label>Webhook 地址</label><input type="password" x-model="cfg.webhook_url"></div><div class="pc-field"><label>上行逻辑接口</label><input x-model="cfg.wan_interfaces" placeholder="wan wwan wwan_fm350"></div></div><div class="pc-checks"><label class="pc-check"><input type="checkbox" x-model="cfg.enabled">启用通知</label><label class="pc-check"><input type="checkbox" x-model="cfg.event_boot">设备启动通知</label><label class="pc-check"><input type="checkbox" x-model="cfg.event_wan">上行连接变化通知</label></div><div class="pc-actions"><button class="pc-btn primary" @click="save()">保存</button><button class="pc-btn" @click="test()">发送测试</button></div><div class="pc-message" x-text="message"></div></section><aside class="pc-card"><h2>最近发送</h2><pre class="pc-history" x-text="status.history||'本次启动尚未发送通知'"></pre><p class="pc-muted" style="margin-top:1rem">其他应用可以调用 <code>/usr/libexec/push-center send 标题 内容</code>，因此以后新增温度、电池、拨号和存储告警时无需再配置手机服务。</p></aside></div></main>{% endblock %}
{% block bottom %}<script>
function pushCenter(){return{status:{},cfg:{provider:'ntfy'},message:'',async req(body){let r=await fetch('/api/v1/extensions/push-center',{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});let d=await r.json();if(!r.ok)throw Error(d.message||'操作失败');return d},booleans(){['enabled','event_boot','event_wan'].forEach(k=>this.cfg[k]=this.cfg[k]==='1'||this.cfg[k]===true)},async load(){try{let d=await this.req();this.status=d;this.cfg=d.config||{};this.booleans()}catch(e){this.message=e.message}},async save(){try{let d=await this.req({action:'save',config:this.cfg});this.message=d.message;await this.load()}catch(e){this.message=e.message}},async test(){try{let d=await this.req({action:'test'});this.message=d.message;await this.load()}catch(e){this.message=e.message}}}}
document.addEventListener('alpine:init',()=>Alpine.store('app').set_page('extensions'));
</script>{% endblock %}
